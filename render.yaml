services:
  - type: web
    name: team-dashboard
    runtime: node
    buildCommand: npm install && npx tsc --skipLibCheck
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/team.db
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: team-db
      mountPath: /data
      sizeGB: 1
